[project]
name = "flat-adapter"
version = "0.1.0"
description = "Flatten nested hierarchical data into flat records for database imports."
readme = "README.md"
authors = [
    { name = "Pavel.Groshev", email = "pavel.groshev@oro.moscow" }
]
requires-python = ">=3.10"
license = { file = "LICENSE" }
keywords = ["flatten", "nested-data", "etl", "database", "adapter"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "python-dateutil>=2.9.0.post0",
]

[project.urls]
Homepage = "https://github.com/groshevpavel/flat_adapter"
Repository = "https://github.com/groshevpavel/flat_adapter"
Issues = "https://github.com/groshevpavel/flat_adapter/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "build>=1.5.0",
    "mypy>=2.3.0",
    "pre-commit>=4.6.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.1",
    "twine>=7.0.0",
    "types-python-dateutil>=2.9.0.20260716",
]

[tool.hatch.build.targets.wheel]
packages = ["src/flat_adapter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-config", "--strict-markers"]
asyncio_mode = "auto"

[tool.coverage.run]
branch = true
source = ["flat_adapter"]

[tool.coverage.report]
show_missing = true
fail_under = 85

[tool.ruff]
target-version = "py310"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "C4",
    "UP",
    "ARG001",
    "ARG002",
    "RET",
    "SIM",
    "PIE",
    "PTH",
    "PERF",
    "RUF012",
    "RUF100",
    "D",
]
ignore = ["D203", "D213"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.10"
strict = true
show_error_codes = true
pretty = true
warn_unreachable = true
enable_error_code = ["ignore-without-code"]
mypy_path = ["src"]
files = ["src", "tests"]
