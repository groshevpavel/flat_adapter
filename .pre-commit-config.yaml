default_language_version:
  python: python3.13

default_stages: [pre-commit]
fail_fast: true

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.1
    hooks:
      - id: ruff-format
      - id: ruff-check
        args: [--fix]

  - repo: local
    hooks:
      - id: mypy-strict
        name: mypy (strict)
        entry: uv run mypy --strict src tests
        language: system
        pass_filenames: false
        always_run: true
        types: [python]

      - id: unit-tests
        name: unit tests
        entry: uv run pytest tests/unit tests/test_package.py -q
        language: system
        pass_filenames: false
        always_run: true
        types: [python]
